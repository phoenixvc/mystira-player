  profiles:
  - id: demo_zoe
    display_name: Zoe
    strengths:
    - Finding things out
    - Noticing details
    - Working things out alone
    versions:
      spot_it: hunt_alone
      plan_it: find_it_yourself
      get_out: decide_each_move
      fire_engine: end_zoe
