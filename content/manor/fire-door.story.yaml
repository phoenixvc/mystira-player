    rationale:
      spot_it: Zoe notices details, so she hunts through the room and finds each hazard herself.
      plan_it: Zoe works things out alone, so she finds the second way out, the meeting place and who to call herself.
      get_out: Zoe works things out alone, so she makes each decision herself when the alarm goes.
  - id: demo_max
    display_name: Max
    strengths:
    - Helping others
    - Explaining to others
    - Putting things in order
    versions:
      spot_it: help_the_mummy
      plan_it: fix_the_sign
      get_out: give_the_order
      fire_engine: end_max
    order: fixed
    rationale:
      spot_it: Max likes helping others, so the mummy shows him each thing and Max tells him what to do.
      plan_it: Max likes explaining to others, so he fixes the mummy’s written plan.
      get_out: Max puts things in order, so he gives the guests the steps and leads them out.
