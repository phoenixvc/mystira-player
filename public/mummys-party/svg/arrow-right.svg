<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4ffad"/><stop offset="0.35" stop-color="#5cee5c"/><stop offset="1" stop-color="#139033"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f6e27"/><stop offset="1" stop-color="#073d15"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6dff7a" stop-opacity="0.55"/><stop offset="1" stop-color="#6dff7a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b"/>
      <feFlood flood-color="#6dff7a" flood-opacity="0.7"/><feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- light pool on the floor -->
  <ellipse cx="350" cy="175" rx="330" ry="105" fill="url(#pool)"/>
  <!-- the arrow lies on the floor: seen in perspective, with a thin raised edge -->
  <g filter="url(#glow)" stroke-linejoin="round">
    <path d="M60 218 L420 224 L420 262 L650 168 L650 182 L420 276 L420 238 L60 232 Z" fill="url(#side)" stroke="#06300f" stroke-width="5"/>
    <path d="M80 118 L420 112 L420 70 L650 168 L420 262 L420 224 L60 218 Z" fill="url(#body)" stroke="#0a3d17" stroke-width="7"/>
    <path d="M95 128 L432 122 L432 92 L470 108 L400 108 L400 140 L100 146 Z" fill="#ffffff" opacity="0.5"/>
    <path d="M445 110 L600 168" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
