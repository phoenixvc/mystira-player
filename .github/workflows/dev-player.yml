name: Player CI and dev deploy

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test, content, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Validate accepted story fixtures
        run: |
          python -m pip install --disable-pip-version-check pyyaml jsonschema
          for story in content/manor/core-preview.story.yaml content/manor/pumpkin-gate.story.yaml; do
            python scripts/check-content.py schema/story-schema-2.1.json "$story"
          done
      - name: Report Fire Door draft content validation
        continue-on-error: true
        run: python scripts/check-content.py schema/story-schema-2.1.json content/manor/fire-door.story.yaml
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: player-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  deploy-dev:
    name: Deploy dev.player.mystira.app
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: dev-player
      url: https://dev.player.mystira.app
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: player-dist
          path: dist
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV_PLAYER }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          production_branch: dev
